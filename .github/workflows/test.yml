name: Test formula

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: Homebrew/actions/setup-homebrew@main

      # setup-homebrew taps this repository at the tested commit.
      - name: Install and test
        run: |
          brew install --build-from-source helpcode-ai/tap/amcp
          brew test helpcode-ai/tap/amcp

      - name: Audit
        run: brew audit --strict --verbose --formula helpcode-ai/tap/amcp
